server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

mqtt:
  broker-url: ${MQTT_BROKER_URL}
  client-id: laundry-backend-server
  topic: laundry/vibration/1
  telemetry-topic: laundry/telemetry/1
  status-topic: laundry/status/+

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL:}

laundry:
  completion-threshold-seconds: 180
  status-gap-seconds: 15

notification:
  poll-ms: 2000
  retry-base-seconds: 5
  retry-max-seconds: 300
  max-attempts: 8
  lease-seconds: 60
